# The safe updater's settings for this app (see deploy/install-updater.sh and deploy/update.sh)
# (read by bash: quote values with spaces)
NAME=jplay
APP=JPlay
SERVICE=jplay.service
# Where the app and the updater exchange update-request.json and update-status.json (the app's state directory)
STATE_DIR=/var/lib/jplay
APP_USER=jplay
HEALTH_URL=http://127.0.0.1:8080/api/v1/health
# When one of these files changed, the Python packages are installed again (in the repo, as its owner)
DEPS_FILES=pyproject.toml
DEPS_CMD='.venv/bin/pip install --quiet -e .[bluetooth]'
