[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jplay"
version = "0.1.0"
description = "JPlay: a headless multi-source music player for Raspberry Pi (radio, Plex, CD, Spotify Connect, Bluetooth)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "plexapi>=4.15",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Bluetooth needs the system D-Bus (Linux only).
bluetooth = ["dbus-next>=0.2.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jplay = "jplay.__main__:main"

[tool.setuptools.packages.find]
include = ["jplay*"]

[tool.setuptools.package-data]
jplay = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
