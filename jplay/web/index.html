<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2026" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d5d8da" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>JPlay</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <section class="deck" aria-label="Now playing">
      <header class="deck-head">
        <h1 class="player-name" id="player-name">JPlay</h1>
        <button class="out-btn" id="out-btn" title="Choose the DAC"><span id="link-state" class="link-state">Connecting</span></button>
      </header>

      <div class="vfd" id="vfd">
        <div class="vfd-art"><img id="np-art" alt="" hidden></div>
        <div class="vfd-text">
          <div class="vfd-counters">
            <span class="vfd-track" id="np-track" aria-label="Track"></span>
            <span class="vfd-time" id="np-time" aria-label="Elapsed time">--:--</span>
          </div>
          <p class="vfd-title" id="np-title">Nothing playing</p>
          <p class="vfd-sub" id="np-artist"></p>
          <p class="vfd-sub dim" id="np-album"></p>
          <p class="vfd-status" id="np-status"></p>
        </div>
      </div>

      <div class="seek">
        <input type="range" id="seek" min="0" max="100" step="0.5" value="0" aria-label="Position" disabled>
        <div class="seek-times"><span id="pos">0:00</span><span id="dur"></span></div>
      </div>

      <div class="transport" role="group" aria-label="Transport">
        <button class="key" id="btn-previous" aria-label="Previous" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6zM19 5v14l-9.5-7z"/></svg>
        </button>
        <button class="key key-main" id="btn-toggle" aria-label="Play" disabled>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
        </button>
        <button class="key" id="btn-next" aria-label="Next" disabled>
          <svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2zM5 5l9.5 7L5 19z"/></svg>
        </button>
        <button class="key" id="btn-stop" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>

      <label class="volume" id="volume-row" hidden>
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
        <output id="volume-out"></output>
      </label>
    </section>

    <section class="browser" aria-label="Sources">
      <nav class="selector" id="selector" role="tablist" aria-label="Sources"></nav>
      <div class="panel" id="panel" role="tabpanel"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
